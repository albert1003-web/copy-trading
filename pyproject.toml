[project]
name = "trade-tracker"
version = "0.1.0"
description = "Personal tracker for congressional stock-trade disclosures"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "db", "ingest", "parse", "enrich", "alerts", "pipeline", "prices", "analytics"]

[tool.setuptools.package-data]
db = ["schema.sql", "migrations/*.sql"]
enrich = ["*.csv"]
analytics = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
