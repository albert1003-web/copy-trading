spring.application.name=trade-tracker

# Local only: never reachable from the network.
server.address=127.0.0.1
server.port=8787

# Shared SQLite database, written by the Python pipelines.
tracker.db-path=${TRACKER_DB_PATH:${user.home}/TradeTracker/tracker.db}
spring.datasource.url=jdbc:sqlite:${tracker.db-path}?busy_timeout=5000&journal_mode=WAL&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# Create tables if the DB is new (schema.sql is copied from ../db/schema.sql; idempotent).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Set to false to skip opening the browser (e.g. during development).
tracker.open-browser=true
